<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — VocoGogo</title>
<meta name="description" content="Get in touch about VocoGogo, the vocabulary learning app.">
<link rel="stylesheet" href="css/style.css">
<style>:root{--accent:#b8305f;--accent-dark:#8f2549;}</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

<header class="site-nav">
  <div class="wrap">
    <a class="brand" href="./"><span class="dot"></span>VocoGogo</a>
    <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="2" y1="5" x2="20" y2="5"/><line x1="2" y1="11" x2="20" y2="11"/><line x1="2" y1="17" x2="20" y2="17"/></svg>
    </button>
    <nav class="links">
      <a href="./">Overview</a>
      <a href="docs.html">Documentation</a>
      <a href="privacy.html">Privacy</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="https://mirodalab.com">All apps</a>
    </nav>
  </div>
</header>

<section class="hero" style="padding-bottom:0">
  <div class="wrap">
    <h1>Get in touch</h1>
    <p class="lead">Questions, bug reports, feature ideas — send a message and I'll get back to you.</p>
  </div>
</section>

<section>
  <div class="wrap" style="max-width:560px">
    <form id="contact-form" class="contact-form" novalidate>
      <div class="form-row">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-row">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <!-- Honeypot: hidden from real visitors via CSS, left for bots -->
      <div class="hp-field" aria-hidden="true">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" tabindex="-1" autocomplete="off">
      </div>

      <div class="form-row">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAEADFp6xcKhu_VGA"></div>
      </div>

      <button type="submit" class="btn btn-primary">Send message</button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>© 2026 VocoGogo, part of MirodaLab.</span>
    <span><a href="https://mirodalab.com">mirodalab.com</a></span>
  </div>
</footer>

<script src="js/nav.js" defer></script>
<script src="js/contact.js" defer></script>
</body>
</html>
